<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>学習記録の編集</title>
    </head>
    <body>
        <h1>学習記録の編集</h1>

        <form th:action="@{/records/{id}/edit(id=${record.id})}"
              method="post">

            <label>学習科目</label>
            <input type="text" name="subject"
                   th:value="${record.subject}"
                   maxlength="100" required>

            <label>学習日</label>
            <input type="date" name="studyDate"
                   th:value="${record.studyDate}" required>

            <label>学習時間（分）</label>
            <input type="number" name="minutes"
                   th:value="${record.minutes}"
                   min="1" max="1440" required>

            <button type="submit">保存</button>
        </form>

        <a th:href="@{/}">一覧に戻る</a>
    </body>
</html>
