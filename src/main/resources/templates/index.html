<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>学習記録管理システム</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>

        <h1>学習記録管理システム</h1>

        <h2>学習記録の登録</h2>

        <form th:action="@{/records}" method="post">
            <label>学習科目</label>
            <input type="text" name="subject"
                   maxlength="100" required>

            <label>学習日</label>
            <input type="date" name="studyDate" required>

            <label>学習時間（分）</label>
            <input type="number" name="minutes"
                   min="1" max="1440" required>

            <button type="submit">登録</button>
        </form>

        <table border="1">
            <thead>
            <tr>
                <th>ID</th>
                <th>学習科目</th>
                <th>学習日</th>
                <th>学習時間</th>
                <th>操作</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.id}"></td>
                <td th:text="${record.subject}"></td>
                <td th:text="${record.studyDate}"></td>
                <td th:text="${record.minutes}"></td>

                <td>
                    <a th:href="@{/records/{id}/edit(id=${record.id})}">
                        編集
                    </a>

                    <form th:action="@{/records/{id}/delete(id=${record.id})}"
                          method="post">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </body>
</html>
