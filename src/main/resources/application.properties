spring.application.name=study-tracker

# MariaDB接続設定
spring.datasource.url=jdbc:mariadb://localhost:3307/study_tracker
spring.datasource.username=study_user
spring.datasource.password=${STUDY_DB_PASSWORD}

# JPA設定
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# サーバーポート
server.port=8080